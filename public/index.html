<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polyclave</title>
<style>
:root {
  --bg: #000;
  --side: #09090a;
  --raise: #111113;
  --raise-hi: #18181b;
  --raise-top: #202024;
  --line: #1c1c1f;
  --line-hi: #2a2a2e;
  --silver: #eceef2;
  --silver-2: #c3c6cc;
  --silver-edge: rgba(226, 230, 236, .46);
  --silver-metal: linear-gradient(150deg, #f6f7f9 0%, #c9ccd2 45%, #8d9199 100%);
  --text: #e8e8eb;
  --text-2: #a7a7ae;
  --text-3: #808087;
  --neon-green: #2dff5c;
  --neon-yellow: #ffe414;
  --neon-orange: #ff6a00;
  --green: #3fb950;
  --green-btn: #238636;
  --green-btn-hi: #1f7a32;
  --yellow: #d4a72c;
  --orange: #e8772e;
  --orange-hi: #f08a45;
  --orange-ink: #1c0a00;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.16, 1, .3, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14.5px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
::selection { background: rgba(195, 198, 204, .28); }
:focus-visible { outline: 2px solid var(--silver-2); outline-offset: 2px; }
* { scrollbar-width: thin; scrollbar-color: var(--line-hi) transparent; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.dim { color: var(--text-3); }
button, input, textarea { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
button { cursor: pointer; }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.iconbtn { width: 28px; height: 28px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--text-3); transition: background .15s, color .15s; }
.iconbtn:hover { background: var(--raise-hi); color: var(--silver); }

.btn { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 10px; font-size: 13.5px; font-weight: 500; background: var(--raise-top); color: var(--silver); box-shadow: inset 0 0 0 1px var(--line-hi); transition: background .15s; }
.btn:hover { background: #29292e; }
.btn[disabled] { color: var(--text-3); background: transparent; cursor: not-allowed; }
.btn.warn { background: var(--orange); color: var(--orange-ink); box-shadow: none; }
.btn.warn:hover { background: var(--orange-hi); }
.btn.quiet { background: transparent; box-shadow: none; color: var(--text-2); }
.btn.quiet:hover { background: var(--raise-hi); color: var(--silver); }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-hi); color: var(--silver); font-size: 14px; transition: background .15s, box-shadow .15s; }
.pill:hover:not([disabled]) { background: var(--raise-hi); box-shadow: inset 0 0 0 1px var(--silver-edge); }
.pill[disabled] { color: var(--text-3); background: transparent; cursor: not-allowed; }
.pill.go { background: var(--green-btn); color: #f2fff4; box-shadow: none; }
.pill.go:hover:not([disabled]) { background: var(--green-btn-hi); }

/* status glyphs */
.g { width: 14px; height: 14px; flex: none; display: inline-block; vertical-align: -2px; overflow: visible; }
.g * { fill: none; stroke-width: 1.8; }
.g.run { color: var(--neon-green); } .g.run .track { stroke: var(--line-hi); } .g.run .arc { stroke: currentColor; stroke-linecap: round; animation: spin 1s linear infinite; transform-origin: 7px 7px; }
.g.wait { color: var(--neon-yellow); } .g.wait circle { stroke: currentColor; stroke-dasharray: 2.88 2.88; stroke-linecap: round; animation: spin 6s linear infinite; transform-origin: 7px 7px; }
.g.need { color: var(--neon-orange); } .g.need .core { fill: currentColor; stroke: none; }
.g.need .ring { stroke: currentColor; stroke-width: 1.4; animation: ping 1.9s var(--ease) infinite; transform-origin: 7px 7px; }
.g.done { color: var(--green); } .g.done circle, .g.done path { stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
.g.done.fresh path { stroke-dasharray: 12; stroke-dashoffset: 12; animation: draw .5s .1s var(--ease) forwards; }
.g.int { color: var(--yellow); } .g.int circle, .g.int path { stroke: currentColor; stroke-linecap: round; }
.g.lockg { color: var(--orange); } .g.lockg rect { fill: currentColor; stroke: none; } .g.lockg path { stroke: currentColor; stroke-linecap: round; }
.g.idle { color: var(--text-3); } .g.idle circle { stroke: currentColor; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes ping { 0% { transform: scale(.55); opacity: .9; } 80%, 100% { transform: scale(1.7); opacity: 0; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes settle { 0% { opacity: 0; transform: translateY(-8px) rotate(-1.2deg); } 60% { opacity: 1; transform: translateY(1px) rotate(.3deg); } 100% { transform: none; } }
.enter { animation: rise .45s var(--ease); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .g.done.fresh path { stroke-dashoffset: 0; } }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px 1px 7px; border-radius: 8px; background: var(--raise-hi); color: var(--silver-2); font-size: 13.5px; line-height: 24px; white-space: nowrap; max-width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip .mono { color: var(--text-3); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; }
.chip .mono:only-of-type, .pill .mono { color: inherit; font-size: 12.5px; }
code.inl { font-family: var(--mono); font-size: 12.5px; padding: 1px 6px; border-radius: 6px; background: var(--raise-hi); color: var(--silver); }
.avatar { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--raise-top); box-shadow: inset 0 0 0 1px var(--silver-edge); color: var(--silver); font: 600 11px/1 var(--sans); letter-spacing: .02em; position: relative; flex: none; }
.avatar.sm { width: 22px; height: 22px; border-radius: 7px; font-size: 11px; }
.avatar .dot { position: absolute; right: -3px; bottom: -3px; width: 13px; height: 13px; border-radius: 50%; background: var(--side); display: grid; place-items: center; }

/* shell */
.app { height: 100vh; display: grid; grid-template-rows: 1fr auto; }
.app > .work { grid-row: 1; }
.app > .statusbar { grid-row: 2; }
.work { display: grid; grid-template-columns: 284px minmax(0, 1fr) 392px; min-height: 0; }
.col { min-height: 0; overflow: auto; }
.tabs { display: none; }

/* sidebar */
.rail { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 10px 10px 14px; gap: 2px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 10px; }
.brand .mark { width: 24px; height: 24px; border-radius: 8px; background: var(--silver-metal); display: grid; place-items: center; color: #15161a; }
.brand b { font-weight: 650; letter-spacing: -.01em; color: var(--silver); flex: 1; }
.nav { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10px; color: var(--text-2); width: 100%; text-align: left; }
.nav:hover { background: var(--raise); color: var(--silver); }
.nav[aria-current="true"] { background: var(--raise-hi); color: var(--silver); }
.nav .count { margin-left: auto; }
.count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--orange); color: var(--orange-ink); font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; }
.sect { display: flex; align-items: center; gap: 2px; padding: 14px 6px 6px 10px; color: var(--text-3); font-size: 12.5px; font-weight: 500; }
.sect span { flex: 1; }
.sess { width: 100%; text-align: left; display: grid; grid-template-columns: 32px 1fr auto; gap: 0 12px; align-items: center; padding: 9px 10px; border-radius: 12px; transition: background .15s, box-shadow .15s; }
.sess:hover { background: var(--raise); }
.sess[aria-current="true"] { background: var(--raise-hi); box-shadow: inset 0 0 0 1px var(--silver-edge); }
.sess .avatar { grid-row: span 2; }
.sess .name { font-weight: 600; color: var(--silver); }
.sess .meta { color: var(--text-3); font-size: 13px; }
.sess .right { grid-row: 1 / span 2; grid-column: 3; display: inline-flex; align-items: center; gap: 5px; color: var(--text-3); font-size: 12.5px; }
.sbadge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 8px; background: var(--raise); color: var(--text-2); font-size: 11.5px; }
.sbadge.frozen { color: var(--orange); }
.sbadge.queued { color: var(--yellow); }
.sbadge.running { color: var(--silver); }
.child { width: 100%; text-align: left; display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; padding: 6px 10px 6px 30px; border-radius: 10px; font-size: 13.5px; color: var(--text-2); }
.child:hover { background: var(--raise); color: var(--silver); }
.child[aria-current="true"] { background: var(--raise-hi); color: var(--silver); }
.child span, .sess .name, .sess .meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.child time { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }

/* new session inline form */
.new-session { border-radius: 12px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-hi); padding: 12px; margin: 6px 0 8px; display: grid; gap: 8px; }
.field { border-radius: 10px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line-hi); padding: 8px 10px; color: var(--text); font-size: 13.5px; width: 100%; outline: none; }
.field:focus { box-shadow: inset 0 0 0 1px var(--silver-edge); }
.field::placeholder { color: var(--text-3); }
.form-row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.err-line { color: var(--orange); font-size: 12.5px; margin: 0; }

/* main */
.main { display: grid; grid-template-rows: auto auto 1fr auto; grid-template-columns: minmax(0, 1fr); min-height: 0; overflow: hidden; }
.main > * { min-width: 0; }
.main > .phone-head { grid-row: 1; }
.main > .tabbar { grid-row: 2; }
.main > .log { grid-row: 3; min-height: 0; }
.main > .composer { grid-row: 4; }
.phone-head { display: none; }
.phone-banner { display: none; }
.tabbar { display: flex; align-items: stretch; height: 44px; border-bottom: 1px solid var(--line); padding: 0 8px; gap: 2px; overflow-x: auto; }
.tab { display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--text-3); font-size: 13.5px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--text-2); }
.tab[aria-selected="true"] { color: var(--silver); border-bottom-color: var(--silver-2); }
.tabbar .iconbtn { align-self: center; flex: none; }
.log { overflow: auto; padding: 22px 32px 28px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-content: start; }
.log > * { max-width: 74ch; min-width: 0; }
.sys { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 13.5px; flex-wrap: wrap; }
.msg p { margin: 0; white-space: pre-wrap; word-break: break-word; }
.msg b { color: var(--silver); font-weight: 600; }
.msg.user-wrap { justify-self: end; display: grid; gap: 4px; justify-items: end; }
.msg.user { background: var(--raise-hi); padding: 10px 15px; border-radius: 16px 16px 6px 16px; }
.turn-tag { color: var(--text-3); font-size: 11.5px; }
.act { display: flex; align-items: center; gap: 9px; color: var(--text-2); flex-wrap: wrap; }
.act > .i { color: var(--text-3); }
.act-btn { cursor: pointer; border-radius: 8px; padding: 1px 0; }
.act-btn:hover .chip { box-shadow: inset 0 0 0 1px var(--silver-edge); }
details.worked summary { cursor: pointer; list-style: none; display: inline-flex; gap: 6px; align-items: center; color: var(--text-3); border-radius: 8px; padding: 2px 6px; margin-left: -6px; }
details.worked summary:hover { color: var(--silver-2); background: var(--raise); }
details.worked summary::-webkit-details-marker { display: none; }
details.worked summary svg.chev { transition: transform .25s var(--ease); }
details.worked[open] summary svg.chev { transform: rotate(90deg); }
.steps { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--side); box-shadow: inset 0 0 0 1px var(--line); }
.step { display: flex; align-items: center; gap: 9px; color: var(--text-2); font-size: 13.5px; min-width: 0; }
.step code { font-family: var(--mono); font-size: 12.5px; color: var(--silver); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step .i { color: var(--text-3); }
.queued { justify-self: end; border-radius: 16px 16px 6px 16px; padding: 10px 15px; box-shadow: inset 0 0 0 1px rgba(212, 167, 44, .4); color: var(--text-2); white-space: pre-wrap; word-break: break-word; }
.queued .who { display: flex; gap: 6px; align-items: center; color: var(--yellow); font-size: 12.5px; margin-bottom: 3px; }
.composer { padding: 10px 32px 10px; }
.box { border-radius: 18px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-hi); padding: 14px 12px 10px 16px; display: grid; gap: 10px; transition: box-shadow .2s; }
.box:focus-within { box-shadow: inset 0 0 0 1px var(--silver-edge); }
.box textarea { width: 100%; min-height: 40px; resize: none; border: 0; background: transparent; color: var(--text); font: inherit; caret-color: var(--silver); outline: none; }
.box textarea::placeholder { color: var(--text-3); }
.box .row { display: flex; align-items: center; gap: 8px; }
.box .model-ro { margin-left: auto; color: var(--text-3); font-size: 13px; padding: 0 6px; }
.send { width: 32px; height: 32px; border-radius: 50%; background: var(--silver-metal); color: #15161a; display: grid; place-items: center; }
.send[disabled] { opacity: .45; cursor: not-allowed; }
.under { display: flex; gap: 16px; padding: 6px 4px 0; color: var(--text-3); font-size: 12.5px; flex-wrap: wrap; min-width: 0; }
.under .mono { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* right panel */
.side { background: var(--side); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.ptabs { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.ptab-title { display: inline-flex; align-items: center; gap: 8px; color: var(--silver); font-size: 13.5px; font-weight: 500; }
.ptabs .grow { flex: 1; }
.detail { padding: 14px 18px 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-content: start; }
.detail > * { min-width: 0; }
.crumb { display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13.5px; text-align: left; }
.crumb:hover { color: var(--silver); }
.title { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.35; color: var(--silver); letter-spacing: -.01em; overflow-wrap: anywhere; }
.title .mono { color: var(--text-3); font-size: 15px; font-weight: 500; margin-right: 6px; }
.statusrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--text-3); }
.statuslabel { display: inline-flex; align-items: center; gap: 7px; color: var(--silver); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px 12px; margin: 0; font-size: 13.5px; padding-top: 14px; border-top: 1px solid var(--line); }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; color: var(--text); word-break: break-word; min-width: 0; }
.one-line { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h4 { margin: 0 0 4px; font-size: 13.5px; font-weight: 500; color: var(--text-3); }
.tl { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 5px 0; font-size: 13.5px; color: var(--text-2); }
.tl span { min-width: 0; overflow-wrap: anywhere; }
.tl b { color: var(--silver); font-weight: 500; }
.tl time { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); padding-top: 2px; }
.tl .i, .tl .g { margin-top: 3px; color: var(--text-3); }
.tl .g.lockg { color: var(--orange); }
.tl .sub { display: block; color: var(--text-3); }

.lock { border-radius: 16px; background: rgba(232, 119, 46, .06); box-shadow: inset 0 0 0 1px rgba(232, 119, 46, .45); padding: 14px 16px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.lock > * { min-width: 0; }
.lock.arrive { animation: settle .7s var(--ease); }
.lock .top { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; color: var(--orange); font-size: 13px; font-weight: 600; min-width: 0; }
.lock .top time { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--text-3); font-weight: 400; }
.lock p { margin: 0; color: var(--text-2); font-size: 13.5px; }
.unlock { display: none; gap: 10px; }
.lock.open .unlock { display: grid; animation: rise .35s var(--ease); }
.lock.open .open-btn { display: none; }
.unlock textarea { min-height: 60px; border-radius: 12px; border: 0; box-shadow: inset 0 0 0 1px rgba(232, 119, 46, .45); background: var(--bg); color: var(--text); font: inherit; font-size: 14px; padding: 10px 12px; resize: none; outline: none; width: 100%; }
.unlock textarea:focus { box-shadow: inset 0 0 0 1px var(--orange); }
.unlock .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.unlock .row .btn { flex: 0 1 auto; max-width: 100%; }
.lock-facts { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 12.5px; }
.lock-facts dt { color: var(--text-3); }
.lock-facts dd { margin: 0; color: var(--text-2); min-width: 0; }
.lock-facts dd.mono { font-size: 11.5px; color: var(--silver-2); }
.lock-check { margin: 0; color: var(--text-3); font-size: 12px; overflow-wrap: anywhere; }
.unlock-what { display: grid; gap: 2px; color: var(--text-2); font-size: 12.5px; }
.unlock-what p { margin: 0; }
.lock-removed { display: flex; align-items: flex-start; gap: 8px; margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-hi); color: var(--text-2); font-size: 13.5px; }
.lock-removed .g { margin-top: 3px; }
.sys.lock-line { flex-wrap: nowrap; align-items: flex-start; }
.lock-line-main { display: inline-flex; align-items: flex-start; gap: 8px; min-width: 0; flex: 1 1 auto; }
.lock-line-main .g { margin-top: 3px; }
.lock-line-text { min-width: 0; overflow-wrap: anywhere; }
.sys.lock-line .btn { height: 28px; flex: none; }

.ask { border-radius: 16px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-hi); padding: 16px; display: grid; gap: 12px; }
.ask .who { display: flex; align-items: center; gap: 10px; }
.ask .who b { color: var(--silver); font-weight: 600; flex: 1; }
.ask .who time { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }
.ask .q { display: flex; gap: 10px; align-items: baseline; color: var(--silver); font-weight: 500; }
.ask .note-field { min-height: 44px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line-hi); background: var(--bg); color: var(--text); font-size: 13.5px; padding: 8px 12px; resize: none; outline: none; width: 100%; }
.ask .note-field:focus { box-shadow: inset 0 0 0 1px var(--silver-edge); }
.ask .opts { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 24px; }
.ask .fine { margin: 0; color: var(--text-3); font-size: 12.5px; padding-left: 24px; }
.ask .fine.reason { color: var(--text-2); }
.ask .opts.confirm { align-items: center; }
.decision-done { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--text-2); font-size: 13.5px; }
.confirm-moved { display: flex; align-items: flex-start; gap: 8px; margin: 0; color: var(--text-2); font-size: 13.5px; }
.confirm-moved .g { margin-top: 3px; }
.ask .ask-note { margin: 0; color: var(--text-2); font-size: 13.5px; padding-left: 24px; }
.field-label { color: var(--text-3); font-size: 12.5px; }
.commit-box { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 10px 12px; border-radius: 12px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-hi); }
.ask .commit-box { background: var(--side); box-shadow: inset 0 0 0 1px var(--line); }
.commit-head { color: var(--text-3); font-size: 12.5px; font-weight: 500; }
.commit-subj { color: var(--silver); font-weight: 500; font-size: 13.5px; overflow-wrap: anywhere; }
.commit-files { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
.commit-file { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 12.5px; min-width: 0; }
.commit-stat { flex: none; color: var(--text-3); white-space: nowrap; }
.commit-more { margin: 0; color: var(--text-3); font-size: 12.5px; }
.mid-path { display: inline-flex; max-width: 100%; min-width: 0; color: var(--text-2); }
.mid-a { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mid-b { flex: none; white-space: nowrap; }
.sys.lock-line { color: var(--text-2); }
.sys.lock-line .g { color: var(--orange); }
.ask .ask-note b { color: var(--silver); font-weight: 600; }

.att-card { border-radius: 12px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-hi); padding: 12px 14px; display: grid; gap: 6px; text-align: left; width: 100%; transition: background .15s, box-shadow .15s; }
.att-card:hover { background: var(--raise-hi); box-shadow: inset 0 0 0 1px var(--silver-edge); }
.att-card .top { display: flex; align-items: center; gap: 8px; color: var(--silver); font-weight: 500; font-size: 13.5px; min-width: 0; }
.att-card .top > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-card .sub { color: var(--text-2); font-size: 13px; overflow-wrap: anywhere; }
.need-group { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 12px; border-radius: 16px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-hi); }
.need-head { display: flex; align-items: center; gap: 8px; color: var(--silver); font-size: 13.5px; font-weight: 600; min-width: 0; }
.need-head b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.need-head .g { margin-left: auto; }
.need-group .att-card { background: var(--raise-hi); }
.need-group .att-card:hover { background: var(--raise-top); }
.new-task { border-radius: 16px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-hi); padding: 14px 16px; display: grid; gap: 10px; }
.new-task label { display: grid; gap: 4px; color: var(--text-3); font-size: 12.5px; }
.empty { color: var(--text-3); font-size: 13.5px; margin: 0; }
.new-task-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 14px 16px; border-radius: 16px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-hi); }
.new-task-wrap .title { font-size: 15px; }
.new-task-wrap .new-task { padding: 0; background: none; box-shadow: none; }
.session-line { margin: 0; color: var(--text-3); font-size: 12.5px; }
.session-line b { color: var(--silver); font-weight: 600; }

/* status bar */
.statusbar { display: flex; align-items: center; gap: 18px; height: 30px; padding: 0 14px; border-top: 1px solid var(--line); background: var(--side); color: var(--text-3); font-size: 12.5px; }
.statusbar span { display: inline-flex; align-items: center; gap: 6px; }
.statusbar .grow { flex: 1; }

/* phone */
@media (max-width: 860px) {
  .app { grid-template-rows: auto auto 1fr; }
  .app > .tabs { grid-row: 1; }
  .app > .phone-banner { grid-row: 2; }
  .app > .work { grid-row: 3; }
  .statusbar { display: none; }
  .tabs { display: flex; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--side); }
  .tabs button { flex: 1; height: 36px; border-radius: 10px; color: var(--text-2); font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .tabs button[aria-selected="true"] { background: var(--raise-hi); color: var(--silver); box-shadow: inset 0 0 0 1px var(--silver-edge); }
  .work { grid-template-columns: minmax(0, 1fr); }
  .work > .col { display: none; border: 0; }
  .work > .col.shown { display: grid; }
  .work > .rail.shown, .work > .side.shown { display: flex; }
  .tabbar { display: none; }
  .log, .composer { padding-left: 16px; padding-right: 16px; }
  .under { display: none; }
  /* connection and current session, phone only */
  .phone-head { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 16px; border-bottom: 1px solid var(--line); color: var(--silver); font-size: 13.5px; font-weight: 600; min-width: 0; }
  .phone-head .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .phone-head .state { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 12.5px; font-weight: 400; flex: none; }
  .phone-banner { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; background: var(--side); border-bottom: 1px solid var(--line); color: var(--orange); font-size: 12.5px; }
  /* touch targets: 44px tall via padding/height, font size unchanged */
  .tabs button { height: 44px; }
  .send { width: 44px; height: 44px; }
  .ask .opts .pill { height: 44px; }
  .lock .btn, .unlock .btn { height: 44px; }
  .unlock .row .btn[type="submit"] { flex: 1 1 100%; order: 2; }
  .unlock .row .btn.quiet { order: 1; }
  details.worked summary { min-height: 44px; padding-top: 10px; padding-bottom: 10px; }
  .act-btn { display: inline-flex; align-items: center; min-height: 44px; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4"/></symbol>
  <symbol id="i-back" viewBox="0 0 16 16"><path d="M13 8H3M7 4L3 8l4 4"/></symbol>
  <symbol id="i-up" viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
  <symbol id="i-bell" viewBox="0 0 16 16"><path d="M4 11V7a4 4 0 0 1 8 0v4l1 1.5H3z M6.5 14h3"/></symbol>
  <symbol id="i-link" viewBox="0 0 16 16"><path d="M7 9a3 3 0 0 0 4.2 0l2-2a3 3 0 0 0-4.2-4.2l-.7.7M9 7a3 3 0 0 0-4.2 0l-2 2A3 3 0 0 0 7 13.2l.7-.7"/></symbol>
  <symbol id="i-term" viewBox="0 0 16 16"><path d="M3 4l4 4-4 4M8.5 12H13"/></symbol>
  <symbol id="i-file" viewBox="0 0 16 16"><path d="M4 2.5h5l3 3v8H4z M9 2.5v3h3"/></symbol>
  <symbol id="i-branch" viewBox="0 0 16 16"><circle cx="4.5" cy="3.5" r="1.5"/><circle cx="4.5" cy="12.5" r="1.5"/><circle cx="11.5" cy="5.5" r="1.5"/><path d="M4.5 5v6M11.5 7c0 3-7 2-7 4"/></symbol>
  <symbol id="i-commit" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.5"/><path d="M1.5 8h4M10.5 8h4"/></symbol>
  <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.5l7 4.5-7 4.5z"/></symbol>
  <symbol id="i-home" viewBox="0 0 16 16"><path d="M2.5 7.5L8 3l5.5 4.5V13h-3.5V9.5h-4V13H2.5z"/></symbol>
  <symbol id="i-mark" viewBox="0 0 16 16"><path d="M3 8l5-5 5 5-5 5z M8 5.5L10.5 8 8 10.5 5.5 8z"/></symbol>
</svg>

<div class="app">
  <div class="phone-banner" id="phone-banner" hidden></div>

  <nav class="tabs" role="tablist" aria-label="Areas">
    <button role="tab" data-tab="rail" aria-selected="false">Sessions</button>
    <button role="tab" data-tab="main" aria-selected="true">Stream</button>
    <button role="tab" data-tab="side" aria-selected="false" id="phone-needs-tab">Needs you</button>
  </nav>

  <main class="work">
    <section class="col rail" data-area="rail" aria-label="Sessions">
      <div class="brand">
        <span class="mark"><svg class="i" style="width:14px;height:14px;stroke-width:1.9"><use href="#i-mark"/></svg></span>
        <b>Polyclave</b>
        <button class="iconbtn" id="new-session-btn" type="button" aria-label="New session" title="New session"><svg class="i"><use href="#i-plus"/></svg></button>
      </div>
      <div id="new-session-box"></div>
      <button class="nav" id="nav-needs" type="button">
        <svg class="i"><use href="#i-bell"/></svg>Needs you
        <span class="count" id="nav-needs-count" hidden>0</span>
      </button>
      <div class="sect"><span>Sessions</span></div>
      <div id="sessions-list"></div>
    </section>

    <section class="col main shown" data-area="main" aria-label="Stream">
      <div class="phone-head" id="phone-head"></div>
      <div class="tabbar" id="session-tabbar" role="tablist"></div>
      <div class="log" id="stream-log"></div>
      <form class="composer" id="composer-form">
        <div class="box">
          <textarea id="composer-input" placeholder="Select or create a session" aria-label="Message"></textarea>
          <div class="row">
            <button class="btn" id="cancel-btn" type="button" hidden>Stop turn</button>
            <span class="model-ro">codex</span>
            <button class="send" id="send-btn" type="submit" aria-label="Send"><svg class="i" style="stroke-width:2"><use href="#i-up"/></svg></button>
          </div>
        </div>
        <div class="under" id="composer-under"></div>
      </form>
    </section>

    <aside class="col side" data-area="side" aria-label="Needs you">
      <div class="ptabs">
        <span class="ptab-title"><svg class="i"><use href="#i-home"/></svg>Needs you <span class="count" id="panel-needs-count" hidden>0</span></span>
        <span class="grow"></span>
        <button class="btn quiet" id="new-task-toggle" type="button">New task</button>
      </div>
      <div class="detail" id="side-body"></div>
    </aside>
  </main>

  <footer class="statusbar" id="statusbar"></footer>
</div>

<script src="/app.js"></script>
</body>
</html>
