[package]
name = "polyclave-hub"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
polyclave-os = { path = "../polyclave-os" }
polyclave-adapters = { path = "../polyclave-adapters" }
futures-util = "0.3"
polyclave-proto = { path = "../polyclave-proto" }
polyclave-store = { path = "../polyclave-store" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
axum = "0.8"
tokio = { version = "1", features = ["macros", "net"] }

