[package]
name = "polyclave-os"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
dunce = "1"
which = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
junction = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes",
  "Win32_System_Threading", "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

