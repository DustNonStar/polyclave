name: check
on:
  push:
    branches: [main, 'dot/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install UI development dependencies
        working-directory: apps/polyclave-app/ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: UI tsc --noEmit
        working-directory: apps/polyclave-app/ui
        run: npm run typecheck
      - name: Build local UI for the desktop shell
        working-directory: apps/polyclave-app/ui
        run: npm run build
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Verify committed proto.ts
        shell: bash
        run: |
          cargo test --locked -p polyclave-proto generated_types_match_source_control
          git diff --exit-code -- apps/polyclave-app/ui/src/generated/proto.ts
      - name: Privacy scan
        shell: bash
        run: |
          git rev-parse --verify origin/main^{commit}
          git log --format=%H origin/main..HEAD >/dev/null
          scripts/privacy-scan.sh

      - name: Install browser test runners
        shell: bash
        working-directory: apps/polyclave-app/ui
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            npx --no-install playwright install chromium webkit
          else
            npx --no-install playwright install chromium
          fi
      - name: Offline UI browser checks
        working-directory: apps/polyclave-app/ui
        env:
          POLYCLAVE_WEBKIT: ${{ matrix.os == 'macos-latest' && '1' || '0' }}
        run: npm run test:browser
